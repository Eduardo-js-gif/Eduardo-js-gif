<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Gastos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #60a5fa;
            font-size: 1.8rem;
        }

        /* Form Section */
        .form-section {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid #334155;
        }

        .type-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .type-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #334155;
            background: transparent;
            color: #94a3b8;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .type-btn.active.income {
            background: #065f46;
            border-color: #10b981;
            color: #10b981;
        }

        .type-btn.active.expense {
            background: #7f1d1d;
            border-color: #ef4444;
            color: #ef4444;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 1rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #60a5fa;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background: #2563eb;
        }

        /* Summary Bar */
        .summary-bar {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .summary-item {
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #334155;
        }

        .summary-label {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .summary-value {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .summary-value.income { color: #10b981; }
        .summary-value.expense { color: #ef4444; }
        .summary-value.balance { color: #60a5fa; }

        /* Transactions Section */
        .transactions-section {
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
            overflow: hidden;
        }

        .section-header {
            padding: 20px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }

        .section-header:hover {
            background: #252f47;
        }

        .section-title {
            font-size: 1.1rem;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toggle-arrow {
            font-size: 0.9rem;
            color: #64748b;
            transition: transform 0.3s ease;
        }

        .toggle-arrow.collapsed {
            transform: rotate(-90deg);
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .filter-buttons {
            display: flex;
            gap: 8px;
        }

        .filter-btn {
            padding: 6px 12px;
            border: 1px solid #334155;
            background: transparent;
            color: #64748b;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: #334155;
            color: #e2e8f0;
        }

        .clear-btn {
            padding: 6px 12px;
            border: 1px solid #ef4444;
            background: transparent;
            color: #ef4444;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .clear-btn:hover {
            background: #ef4444;
            color: white;
        }

        .transactions-content {
            max-height: 500px;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }

        .transactions-content.collapsed {
            max-height: 0;
        }

        .transactions-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .transaction-item {
            padding: 15px 20px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .transaction-item:hover {
            background: #252f47;
        }

        .transaction-info {
            flex: 1;
        }

        .transaction-description {
            font-weight: 500;
            color: #e2e8f0;
            margin-bottom: 3px;
        }

        .transaction-meta {
            font-size: 0.8rem;
            color: #64748b;
        }

        .transaction-amount {
            font-weight: 700;
            font-size: 1.1rem;
            margin-right: 15px;
        }

        .transaction-amount.income { color: #10b981; }
        .transaction-amount.expense { color: #ef4444; }

        .transaction-actions {
            display: flex;
            gap: 5px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .transaction-item:hover .transaction-actions {
            opacity: 1;
        }

        .action-btn {
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 5px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        .action-btn.edit:hover {
            color: #3b82f6;
        }

        .action-btn.delete:hover {
            color: #ef4444;
        }

        .empty-state {
            padding: 40px;
            text-align: center;
            color: #64748b;
        }

        /* Scrollbar */
        .transactions-list::-webkit-scrollbar {
            width: 6px;
        }

        .transactions-list::-webkit-scrollbar-track {
            background: #0f172a;
        }

        .transactions-list::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #334155;
            max-width: 400px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #e2e8f0;
            text-align: center;
        }

        .modal-text {
            color: #94a3b8;
            margin-bottom: 20px;
            font-size: 0.95rem;
            text-align: center;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .modal-btn.cancel {
            background: #334155;
            color: #e2e8f0;
        }

        .modal-btn.cancel:hover {
            background: #475569;
        }

        .modal-btn.confirm {
            background: #ef4444;
            color: white;
        }

        .modal-btn.confirm:hover {
            background: #dc2626;
        }

        .modal-btn.save {
            background: #3b82f6;
            color: white;
        }

        .modal-btn.save:hover {
            background: #2563eb;
        }

        /* Edit Modal Specifics */
        .edit-modal .modal {
            max-width: 450px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #10b981;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 500;
            opacity: 0;
            transition: all 0.3s;
            z-index: 1001;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.error {
            background: #ef4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 Controle de Gastos</h1>

        <!-- Summary -->
        <div class="summary-bar">
            <div class="summary-item">
                <div class="summary-label">Entradas</div>
                <div class="summary-value income" id="totalIncome">R$ 0,00</div>
            </div>
            <div class="summary-item">
                <div class="summary-label">Saídas</div>
                <div class="summary-value expense" id="totalExpense">R$ 0,00</div>
            </div>
            <div class="summary-item">
                <div class="summary-label">Saldo</div>
                <div class="summary-value balance" id="totalBalance">R$ 0,00</div>
            </div>
        </div>

        <!-- Form -->
        <div class="form-section">
            <div class="type-selector">
                <button type="button" class="type-btn income active" onclick="setType('income')">
                    ↓ Entrada
                </button>
                <button type="button" class="type-btn expense" onclick="setType('expense')">
                    ↑ Saída
                </button>
            </div>

            <form id="transactionForm">
                <input type="hidden" id="type" value="income">
                
                <div class="form-group">
                    <label>Descrição</label>
                    <input type="text" id="description" placeholder="Ex: Salário, Mercado..." required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Valor (R$)</label>
                        <input type="number" id="amount" step="0.01" min="0.01" placeholder="0,00" required>
                    </div>
                    <div class="form-group">
                        <label>Data</label>
                        <input type="date" id="date" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Categoria</label>
                    <select id="category" required>
                        <option value="">Selecione...</option>
                    </select>
                </div>

                <button type="submit" class="submit-btn">Adicionar Transação</button>
            </form>
        </div>

        <!-- Transactions Section -->
        <div class="transactions-section">
            <div class="section-header" onclick="toggleHistory()">
                <div class="section-title">
                    <span>📋 Histórico</span>
                    <span class="toggle-arrow" id="toggleArrow">▼</span>
                </div>
                <div class="header-actions" onclick="event.stopPropagation()">
                    <div class="filter-buttons">
                        <button class="filter-btn active" onclick="filter('all'); event.stopPropagation();">Todas</button>
                        <button class="filter-btn" onclick="filter('income'); event.stopPropagation();">Entradas</button>
                        <button class="filter-btn" onclick="filter('expense'); event.stopPropagation();">Saídas</button>
                    </div>
                    <button class="clear-btn" onclick="showClearModal(); event.stopPropagation();" title="Limpar todos os dados">
                        <span>🗑</span>
                        <span>Limpar</span>
                    </button>
                </div>
            </div>
            <div class="transactions-content" id="transactionsContent">
                <div class="transactions-list" id="transactionsList">
                    <div class="empty-state">Nenhuma transação registrada</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Confirmação Limpar -->
    <div class="modal-overlay" id="clearModal">
        <div class="modal">
            <h3 class="modal-title">⚠️ Limpar todos os dados?</h3>
            <p class="modal-text">
                Isso apagará permanentemente todas as transações do mês atual. 
                Esta ação não pode ser desfeita.
            </p>
            <div class="modal-buttons">
                <button class="modal-btn cancel" onclick="hideClearModal()">Cancelar</button>
                <button class="modal-btn confirm" onclick="clearAllData()">Sim, limpar tudo</button>
            </div>
        </div>
    </div>

    <!-- Modal de Edição -->
    <div class="modal-overlay edit-modal" id="editModal">
        <div class="modal">
            <h3 class="modal-title">✏️ Editar Transação</h3>
            <form id="editForm">
                <input type="hidden" id="editId">
                
                <div class="form-group">
                    <label>Tipo</label>
                    <div class="type-selector">
                        <button type="button" class="type-btn income" id="editBtnIncome" onclick="setEditType('income')">
                            ↓ Entrada
                        </button>
                        <button type="button" class="type-btn expense" id="editBtnExpense" onclick="setEditType('expense')">
                            ↑ Saída
                        </button>
                    </div>
                    <input type="hidden" id="editType" value="income">
                </div>

                <div class="form-group">
                    <label>Descrição</label>
                    <input type="text" id="editDescription" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Valor (R$)</label>
                        <input type="number" id="editAmount" step="0.01" min="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>Data</label>
                        <input type="date" id="editDate" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Categoria</label>
                    <select id="editCategory" required>
                        <option value="">Selecione...</option>
                    </select>
                </div>

                <div class="modal-buttons">
                    <button type="button" class="modal-btn cancel" onclick="hideEditModal()">Cancelar</button>
                    <button type="submit" class="modal-btn save">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // Data
        let transactions = JSON.parse(localStorage.getItem('transactions')) || [];
        let currentFilter = 'all';
        let isHistoryCollapsed = false;

        const categories = {
            income: [
                { id: 'salary', name: 'Salário' },
                { id: 'freelance', name: 'Freelance' },
                { id: 'investment', name: 'Investimentos' },
                { id: 'gift', name: 'Presente' },
                { id: 'other', name: 'Outros' }
            ],
            expense: [
                { id: 'food', name: 'Alimentação' },
                { id: 'transport', name: 'Transporte' },
                { id: 'housing', name: 'Moradia' },
                { id: 'health', name: 'Saúde' },
                { id: 'leisure', name: 'Lazer' },
                { id: 'shopping', name: 'Compras' },
                { id: 'bills', name: 'Contas' },
                { id: 'other', name: 'Outros' }
            ]
        };

        // Init - Corrigido para usar data local corretamente
        function initDate() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            document.getElementById('date').value = `${year}-${month}-${day}`;
        }

        initDate();
        updateCategoryOptions();
        updateUI();

        // Toggle History
        function toggleHistory() {
            isHistoryCollapsed = !isHistoryCollapsed;
            const content = document.getElementById('transactionsContent');
            const arrow = document.getElementById('toggleArrow');
            
            if (isHistoryCollapsed) {
                content.classList.add('collapsed');
                arrow.classList.add('collapsed');
                arrow.textContent = '▼';
            } else {
                content.classList.remove('collapsed');
                arrow.classList.remove('collapsed');
                arrow.textContent = '▲';
            }
        }

        // Set Type (Add Form)
        function setType(type) {
            document.getElementById('type').value = type;
            document.querySelectorAll('.form-section .type-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`.form-section .type-btn.${type}`).classList.add('active');
            updateCategoryOptions();
        }

        // Set Type (Edit Form)
        function setEditType(type) {
            document.getElementById('editType').value = type;
            document.getElementById('editBtnIncome').classList.remove('active');
            document.getElementById('editBtnExpense').classList.remove('active');
            
            if (type === 'income') {
                document.getElementById('editBtnIncome').classList.add('active', 'income');
                document.getElementById('editBtnExpense').classList.remove('active', 'expense');
            } else {
                document.getElementById('editBtnExpense').classList.add('active', 'expense');
                document.getElementById('editBtnIncome').classList.remove('active', 'income');
            }
            
            updateEditCategoryOptions();
        }

        // Update Categories (Add Form)
        function updateCategoryOptions() {
            const type = document.getElementById('type').value;
            const select = document.getElementById('category');
            select.innerHTML = '<option value="">Selecione...</option>';
            categories[type].forEach(cat => {
                select.innerHTML += `<option value="${cat.id}">${cat.name}</option>`;
            });
        }

        // Update Categories (Edit Form)
        function updateEditCategoryOptions() {
            const type = document.getElementById('editType').value;
            const select = document.getElementById('editCategory');
            const currentValue = select.value;
            
            select.innerHTML = '<option value="">Selecione...</option>';
            categories[type].forEach(cat => {
                select.innerHTML += `<option value="${cat.id}">${cat.name}</option>`;
            });
            
            if (currentValue) {
                select.value = currentValue;
            }
        }

        // Add Transaction - Corrigido para usar a data do input corretamente
        document.getElementById('transactionForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const dateInput = document.getElementById('date').value;
            
            const transaction = {
                id: Date.now(),
                type: document.getElementById('type').value,
                description: document.getElementById('description').value,
                amount: parseFloat(document.getElementById('amount').value),
                category: document.getElementById('category').value,
                date: dateInput // Salva a string da data diretamente (YYYY-MM-DD)
            };

            transactions.unshift(transaction);
            save();
            
            // Reset
            document.getElementById('description').value = '';
            document.getElementById('amount').value = '';
            document.getElementById('category').value = '';
            initDate(); // Reseta para data atual
            
            // Expand history if collapsed
            if (isHistoryCollapsed) {
                toggleHistory();
            }
            
            updateUI();
            showToast('Transação adicionada!');
        });

        // Edit Transaction
        function editTransaction(id) {
            const transaction = transactions.find(t => t.id === id);
            if (!transaction) return;

            document.getElementById('editId').value = transaction.id;
            document.getElementById('editDescription').value = transaction.description;
            document.getElementById('editAmount').value = transaction.amount;
            document.getElementById('editDate').value = transaction.date; // Usa a string diretamente
            
            setEditType(transaction.type);
            document.getElementById('editCategory').value = transaction.category;
            
            showEditModal();
        }

        // Save Edit
        document.getElementById('editForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const id = parseInt(document.getElementById('editId').value);
            const index = transactions.findIndex(t => t.id === id);
            
            if (index === -1) return;
            
            transactions[index] = {
                id: id,
                type: document.getElementById('editType').value,
                description: document.getElementById('editDescription').value,
                amount: parseFloat(document.getElementById('editAmount').value),
                category: document.getElementById('editCategory').value,
                date: document.getElementById('editDate').value // Salva a string da data diretamente
            };
            
            save();
            updateUI();
            hideEditModal();
            showToast('Transação atualizada!');
        });

        // Delete
        function deleteTransaction(id) {
            if (confirm('Excluir esta transação?')) {
                transactions = transactions.filter(t => t.id !== id);
                save();
                updateUI();
                showToast('Transação excluída!', 'error');
            }
        }

        // Filter
        function filter(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            renderList();
        }

        // Modal Functions
        function showClearModal() {
            document.getElementById('clearModal').classList.add('show');
        }

        function hideClearModal() {
            document.getElementById('clearModal').classList.remove('show');
        }

        function showEditModal() {
            document.getElementById('editModal').classList.add('show');
        }

        function hideEditModal() {
            document.getElementById('editModal').classList.remove('show');
        }

        // Clear All Data
        function clearAllData() {
            transactions = [];
            save();
            updateUI();
            hideClearModal();
            showToast('Todos os dados foram limpos!', 'error');
        }

        // Close modals on outside click
        document.getElementById('clearModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('clearModal')) {
                hideClearModal();
            }
        });

        document.getElementById('editModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('editModal')) {
                hideEditModal();
            }
        });

        // Save
        function save() {
            localStorage.setItem('transactions', JSON.stringify(transactions));
        }

        // Update UI
        function updateUI() {
            const income = transactions.filter(t => t.type === 'income').reduce((a, t) => a + t.amount, 0);
            const expense = transactions.filter(t => t.type === 'expense').reduce((a, t) => a + t.amount, 0);
            
            document.getElementById('totalIncome').textContent = formatMoney(income);
            document.getElementById('totalExpense').textContent = formatMoney(expense);
            document.getElementById('totalBalance').textContent = formatMoney(income - expense);

            renderList();
        }

        // Render List - Corrigido para formatar data corretamente
        function renderList() {
            const list = document.getElementById('transactionsList');
            let filtered = transactions;
            if (currentFilter !== 'all') {
                filtered = transactions.filter(t => t.type === currentFilter);
            }

            if (filtered.length === 0) {
                list.innerHTML = '<div class="empty-state">Nenhuma transação encontrada</div>';
                return;
            }

            list.innerHTML = filtered.map(t => {
                const catName = categories[t.type].find(c => c.id === t.category)?.name || t.category;
                
                // Formata a data corretamente sem problemas de timezone
                const formattedDate = formatDateLocal(t.date);
                
                return `
                    <div class="transaction-item">
                        <div class="transaction-info">
                            <div class="transaction-description">${t.description}</div>
                            <div class="transaction-meta">${formattedDate} • ${catName}</div>
                        </div>
                        <div class="transaction-amount ${t.type}">
                            ${t.type === 'income' ? '+' : '-'} ${formatMoney(t.amount)}
                        </div>
                        <div class="transaction-actions">
                            <button class="action-btn edit" onclick="editTransaction(${t.id})" title="Editar">
                                ✏️
                            </button>
                            <button class="action-btn delete" onclick="deleteTransaction(${t.id})" title="Excluir">
                                🗑
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Formata data local sem problemas de timezone
        function formatDateLocal(dateString) {
            if (!dateString) return '';
            
            // Divide a string YYYY-MM-DD
            const [year, month, day] = dateString.split('-');
            
            // Retorna no formato DD/MM/YYYY
            return `${day}/${month}/${year}`;
        }

        // Helpers
        function formatMoney(value) {
            return new Intl.NumberFormat('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            }).format(value);
        }

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast show' + (type === 'error' ? ' error' : '');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }
    </script>
</body>
</html>
